<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B2A49">
<title>慣性デリバリー</title>
<link rel="stylesheet" href="style.css?v=0.2.0">
</head>
<body>
<div id="frame">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-item"><span class="hud-label" id="lbl-speed"></span><span class="hud-value" id="val-speed"></span></div>
    <div class="hud-item"><span class="hud-label" id="lbl-accel"></span><span class="hud-value" id="val-accel"></span></div>
    <div class="hud-item"><span class="hud-label" id="lbl-thrust"></span><span class="hud-value" id="val-thrust"></span></div>
    <div class="hud-item"><span class="hud-label" id="lbl-time"></span><span class="hud-value" id="val-time"></span></div>
    <div class="hud-item"><span class="hud-label" id="lbl-fuel"></span><span class="hud-value" id="val-fuel"></span></div>
    <div class="hud-item"><span class="hud-label" id="lbl-cost"></span><span class="hud-value" id="val-cost"></span></div>
    <div id="remain"></div>
  </div>
  <button id="btn-pause" type="button" aria-label="一時停止">II</button>
  <div id="version"></div>

  <!-- 機体選択 -->
  <div id="select" class="screen" hidden>
    <div id="select-request"></div>
    <div id="select-title"></div>
    <div id="select-cards"></div>
    <div id="select-note"></div>
  </div>

  <!-- 結果（給料と燃料代の天引き） -->
  <div id="result" class="screen" hidden>
    <div id="result-title"></div>
    <div id="result-rows">
      <div class="row" id="row-base"><span></span><span class="num"></span></div>
      <div class="row" id="row-precision"><span></span><span class="num"></span></div>
      <div class="row" id="row-speed"><span></span><span class="num"></span></div>
    </div>
    <div id="pay-box">
      <div id="pay-label"></div>
      <div id="pay-amount"></div>
    </div>
    <div id="slip"><span id="slip-label"></span><span class="num" id="slip-amount"></span></div>
    <div id="stars"></div>
    <div id="wallet"></div>
    <div id="result-buttons">
      <button id="btn-again" type="button"></button>
      <button id="btn-change" type="button"></button>
    </div>
    <div id="skip-hint"></div>
  </div>

  <div id="overlay" hidden>
    <div id="overlay-box">
      <div id="overlay-title"></div>
      <div id="overlay-body"></div>
      <button id="overlay-main" type="button"></button>
      <button id="overlay-sub" type="button"></button>
    </div>
  </div>
</div>

<script src="src/config.js?v=0.2.0"></script>
<script src="src/texts.js?v=0.2.0"></script>
<script src="src/stages.js?v=0.2.0"></script>
<script src="src/physics.js?v=0.2.0"></script>
<script src="src/input.js?v=0.2.0"></script>
<script src="src/render.js?v=0.2.0"></script>
<script src="src/audio.js?v=0.2.0"></script>
<script src="src/main.js?v=0.2.0"></script>
</body>
</html>
