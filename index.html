<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B2A49">
<title>慣性デリバリー</title>
<link rel="stylesheet" href="style.css?v=0.5.1">
</head>
<body>
<div id="frame">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-item"><span class="hud-label" id="lbl-speed"></span><span class="hud-value" id="val-speed"></span></div>
    <div class="hud-item"><span class="hud-label" id="lbl-accel"></span><span class="hud-value" id="val-accel"></span></div>
    <div class="hud-item"><span class="hud-label" id="lbl-thrust"></span><span class="hud-value" id="val-thrust"></span></div>
    <div class="hud-item"><span class="hud-label" id="lbl-time"></span><span class="hud-value" id="val-time"></span></div>
    <div class="hud-item"><span class="hud-label" id="lbl-fuel"></span><span class="hud-value" id="val-fuel"></span></div>
    <div class="hud-item"><span class="hud-label" id="lbl-cost"></span><span class="hud-value" id="val-cost"></span></div>
    <div id="remain"></div>
  </div>
  <button id="btn-pause" type="button" aria-label="一時停止">II</button>
  <div id="version"></div>
  <button id="btn-sound" type="button">♪</button>

  <!-- タイトル -->
  <div id="title" class="screen" hidden>
    <div id="title-name"></div>
    <button id="btn-begin" class="btn primary" type="button"></button>
    <div id="title-sub">
      <button id="btn-lang" class="btn" type="button"></button>
      <button id="btn-qr" class="btn" type="button"></button>
    </div>
  </div>

  <!-- QRコード（URLの最後に ?qr=1 を付けると最初に開く） -->
  <div id="qr" class="screen" hidden>
    <div id="qr-name"></div>
    <div id="qr-title"></div>
    <img id="qr-img" src="src/qr.svg?v=0.5.1" alt="QR">
    <div id="qr-url"></div>
    <button id="btn-qr-back" class="btn primary" type="button"></button>
  </div>

  <!-- 機体選択 -->
  <div id="select" class="screen" hidden>
    <div id="select-title" class="heading"></div>
    <div id="select-cards"></div>
    <div id="select-note"></div>
  </div>

  <!-- ステージ選択 -->
  <div id="stages" class="screen" hidden>
    <div id="stages-title" class="heading"></div>
    <div id="stages-wallet"></div>
    <div id="stages-list"></div>
    <button id="btn-stages-back" class="btn" type="button"></button>
  </div>

  <!-- 依頼（冒頭のフック） -->
  <div id="brief" class="screen" hidden>
    <div id="brief-label"></div>
    <div id="brief-name"></div>
    <div id="brief-hook"></div>
    <div id="brief-info">
      <div class="row"><span id="brief-base-l"></span><span class="num" id="brief-base"></span></div>
      <div class="row"><span id="brief-time-l"></span><span class="num" id="brief-time"></span></div>
    </div>
    <button id="btn-depart" class="btn primary" type="button"></button>
    <button id="btn-brief-back" class="btn" type="button"></button>
  </div>

  <!-- 結果（給料と燃料代の天引き） -->
  <div id="result" class="screen" hidden>
    <div id="result-title"></div>
    <div id="result-rows">
      <div class="row" id="row-base"><span></span><span class="num"></span></div>
      <div class="row" id="row-precision"><span></span><span class="num"></span></div>
      <div class="row" id="row-speed"><span></span><span class="num"></span></div>
    </div>
    <div id="pay-box">
      <div id="pay-label"></div>
      <div id="pay-amount"></div>
    </div>
    <div id="slip"><span id="slip-label"></span><span class="num" id="slip-amount"></span></div>
    <div id="stars"></div>
    <div id="wallet"></div>
    <div id="result-buttons">
      <button id="btn-next" class="btn primary" type="button"></button>
      <button id="btn-again" class="btn" type="button"></button>
      <button id="btn-to-stages" class="btn" type="button"></button>
    </div>
    <div id="skip-hint"></div>
  </div>

  <!-- 一時停止・失敗 -->
  <div id="overlay" hidden>
    <div id="overlay-box">
      <div id="overlay-title"></div>
      <div id="overlay-body"></div>
      <div id="overlay-buttons"></div>
    </div>
  </div>
</div>

<script src="src/config.js?v=0.5.1"></script>
<script src="src/texts.js?v=0.5.1"></script>
<script src="src/stages.js?v=0.5.1"></script>
<script src="src/physics.js?v=0.5.1"></script>
<script src="src/input.js?v=0.5.1"></script>
<script src="src/render.js?v=0.5.1"></script>
<script src="src/audio.js?v=0.5.1"></script>
<script src="src/main.js?v=0.5.1"></script>
</body>
</html>
