<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B2A49">
<title>セキオロック運送 配送センター</title>
<link rel="stylesheet" href="home.css?v=1.0.0">
</head>
<body>
<!-- ホーム画面：ここから慣性デリバリーとパラボラ便を選ぶ -->
<div id="frame">
  <main id="home">
    <header>
      <div id="company">株式会社セキオロック運送</div>
      <h1>配送センター</h1>
      <p id="lead">今日の仕事を選んでください</p>
    </header>

    <div id="total">
      <span id="total-label">所持金（2つの仕事の合計）</span>
      <span id="total-amount"></span>
    </div>

    <a class="job" id="job-inertia" href="inertia/">
      <canvas class="art" id="art-inertia"></canvas>
      <div class="info">
        <div class="dept">宇宙配送部</div>
        <div class="name">慣性デリバリー</div>
        <div class="crew">しずか・たけし</div>
        <div class="topic">噴射して、止めて、届ける ／ 慣性の法則・運動方程式</div>
        <div class="wallet" id="wallet-inertia"></div>
      </div>
    </a>

    <a class="job" id="job-parabola" href="parabola/">
      <canvas class="art" id="art-parabola"></canvas>
      <div class="info">
        <div class="dept">投てき部</div>
        <div class="name">パラボラ便</div>
        <div class="crew">くりまんじゅう</div>
        <div class="topic">投げて、届ける ／ 直線運動・斜面・地球・月・火星・木星</div>
        <div class="wallet" id="wallet-parabola"></div>
      </div>
    </a>

    <footer>
      <button id="btn-qr" type="button">QRコード</button>
      <span id="version">v1.2.0</span>
    </footer>
  </main>

  <!-- QRコード（URLの最後に ?qr=1 を付けると最初に開く） -->
  <section id="qr" hidden>
    <div id="qr-name">配送センター</div>
    <div id="qr-title">スマホのカメラで読み取ってください</div>
    <img id="qr-img" src="home-qr.svg?v=1.0.0" alt="QR">
    <div id="qr-url">https://sekiorock.github.io/inertia-delivery/</div>
    <button id="btn-qr-back" type="button">ホームへ</button>
  </section>
</div>

<!-- キャラクターの絵は、それぞれのゲームの描画プログラムを借りて描く -->
<script src="inertia/src/config.js?v=0.6.2"></script>
<script src="inertia/src/render.js?v=0.6.2"></script>
<script src="parabola/src/render.js?v=0.6.0"></script>
<script src="home.js?v=1.0.0"></script>
</body>
</html>
